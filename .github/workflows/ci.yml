name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Breeding provenance tests verify immutable blobs at the reviewed
          # baseline commit, so a shallow checkout is insufficient.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Encounter presentation contract consistency
        run: npm run check:encounter-presentation

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Pure tests
        run: npm test -- --exclude tests/server/encounterWorkspaceProjection.test.ts

      - name: Performance-sensitive encounter projection tests
        # Wall-clock budgets must not compete with the other Vitest workers.
        run: npm test -- tests/server/encounterWorkspaceProjection.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Nuxt runtime tests
        run: npm run test:nuxt

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production-build browser and accessibility acceptance
        run: npm run test:e2e

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
